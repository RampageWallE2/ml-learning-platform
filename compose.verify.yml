# Disposable integration project; no host ports, no existing env file, no volumes.
name: exploralab-verify
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exploralab_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: local-test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test_user -d exploralab_test]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: testing
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:local-test-only-password@database:5432/exploralab_test
      CORS_ORIGINS: http://localhost:4200
      APP_ENV: development
    depends_on:
      database:
        condition: service_healthy
