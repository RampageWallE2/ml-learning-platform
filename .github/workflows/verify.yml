name: Verify release and publish GHCR images (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build -- --configuration production
      - run: npm audit --audit-level=high
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f compose.verify.yml up -d --wait database
      - run: docker compose -f compose.verify.yml run --build --rm tests
      - if: always()
        run: docker compose -f compose.verify.yml down
  https-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-production.lock
      - name: Check EC2 preparation without deploying
        run: |
          python -B -m unittest discover -s infra/tests -v
          bash -n infra/ec2_certbot_hook.sh
          docker compose --env-file .env.ec2.example -p exploralab-ec2 -f compose.production.yml config --quiet
      - run: pip install pip-audit
      - run: pip-audit --no-deps --disable-pip -r backend/requirements-production.lock
      - run: python infra/release.py prepare
      - run: python infra/release.py up
      - run: python infra/checks/http_smoke.py --exercise-account
      - run: python infra/checks/resilience_smoke.py
      - run: python infra/release.py backup
      - name: Restore the test backup in a new database
        run: python infra/release.py restore-test --archive "$(find infra/.local/backups -name '*.dump' -type f | head -n 1)"
      - if: always()
        run: python infra/release.py down
  publish-images:
    name: Publish ${{ matrix.image }} to GHCR
    needs: [frontend, postgresql, https-rehearsal]
    # Only an explicit manual run on master can publish; pushes and PRs only verify.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Identify the versioned image
        id: image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}"
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s:sha-%s\n' "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the production image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile.production
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: ${{ matrix.image == 'web' && format('APP_VERSION={0}', github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.image }}
          cache-to: type=gha,scope=production-${{ matrix.image }},mode=max
      - name: Record the exact published image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### Imagen publicada\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Versión: `%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Referencia exacta: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\nNo se ha desplegado en AWS.\n' >> "$GITHUB_STEP_SUMMARY"
