services:
  database:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ml_learning
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d ml_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+psycopg://ml_user:ml_password@database:5432/ml_learning
      CORS_ORIGINS: http://localhost:4200
      FLASK_DEBUG: "1"

    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app

    command: >
      sh -c "flask --app app db upgrade &&
             flask --app app run --host 0.0.0.0 --port 5000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm start -- --host 0.0.0.0 --poll 2000

    restart: unless-stopped

volumes:
  postgres_data:
