@if (auth.user(); as user) {
  <div
    class="account-menu"
    [class.account-menu--landing]="appearance() === 'landing'"
    [class.account-menu--bottom-left]="placement() === 'bottom-left'"
  >
    <button
      class="account-menu__trigger"
      type="button"
      [attr.aria-label]="(menuOpen() ? 'Cerrar cuenta de ' : 'Abrir cuenta de ') + user.displayName"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuOpen() ? panelId : null"
      [title]="user.displayName"
      (click)="toggleMenu()"
    >
      @if (user.avatarUrl && !avatarFailed()) {
        <img
          class="account-menu__avatar"
          [src]="user.avatarUrl"
          alt=""
          referrerpolicy="no-referrer"
          (error)="markAvatarAsFailed()"
        />
      } @else {
        <span class="account-menu__initials" aria-hidden="true">
          {{ initials() }}
        </span>
      }

      @if (appearance() === 'game') {
        <span class="account-menu__label">Cuenta</span>
      } @else {
        <span class="account-menu__name">{{ user.displayName }}</span>
      }

      <span class="account-menu__arrow" aria-hidden="true">
        {{ placement() === 'bottom-left' ? (menuOpen() ? '▼' : '▲') : (menuOpen() ? '▲' : '▼') }}
      </span>
    </button>

    @if (menuOpen()) {
      <div class="account-menu__panel" [id]="panelId">
        <div class="account-menu__identity">
          <strong>{{ user.displayName }}</strong>
          <span>{{ user.email }}</span>
        </div>

        @if (appearance() === 'game') {
          <a class="account-menu__progress" routerLink="/progress" (click)="closeMenu()">
            Mi progreso <span aria-hidden="true">→</span>
          </a>
          @if (helpAvailable()) {
            <button class="account-menu__help" type="button" (click)="openHelp()">Cómo jugar</button>
          }
        }

        <button
          class="account-menu__logout"
          type="button"
          [disabled]="loggingOut()"
          (click)="logout()"
        >
          {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
        </button>

        @if (logoutError(); as message) {
          <p class="account-menu__error" role="alert">
            {{ message }}
          </p>
        }
      </div>
    }
  </div>
}
