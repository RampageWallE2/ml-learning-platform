<div class="world-page">

  <div id="phaser-container"></div>

  @if (currentObjective()) {
    <div class="objective">
      <strong>Objetivo</strong>
      <span>{{ currentObjective() }}</span>
    </div>
  }

  @if (lessonActive(); as lesson) {
    <div class="lesson-overlay">
      <div class="lesson-panel">

        @if (
          lesson.lessonId === 'lesson-01' &&
          lesson.step === 1
        ) {
          <app-lesson-01-nursery
            (completed)="closeLesson()"
          />
        }

      </div>
    </div>
  }

  @if (activeDialogue(); as dialogue) {
    <app-dialogue
      [dialogue]="dialogue"
      (completed)="closeDialogue()"
    />
  }

</div>
