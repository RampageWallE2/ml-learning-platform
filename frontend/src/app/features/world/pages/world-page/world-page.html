<div class="world-page">

  <!-- =========================
       PROGRESO
       ========================= -->

  @if (
    progressPanel();
    as panel
  ) {

    <app-zone-progress
      [name]="panel.name"
      [topic]="panel.topic"
      [objective]="panel.objective"
      [zone]="panel.zone"
    />

  }


  <!-- =========================
       PHASER
       ========================= -->

  <div
    id="phaser-container"
  ></div>


  <!-- =========================
       ACTIVIDAD BLOQUEADA
       ========================= -->

  @if (
    blockedLessonMessage();
    as message
  ) {

    <div
      class="lesson-locked-toast"
      role="status"
      aria-live="polite"
    >

      <div class="lesson-locked-icon">
        🔒
      </div>


      <div class="lesson-locked-content">

        <strong>
          Actividad bloqueada
        </strong>

        <p>
          {{ message }}
        </p>

      </div>

    </div>

  }


  <!-- =========================
       LECCIONES
       ========================= -->

  @if (
    lessonActive();
    as lesson
  ) {

    <app-interaction-panel
      (closed)="closeLesson()"
    >

      <app-lesson-runner
        [lessonId]="lesson.lessonId"
        (completed)="completeLesson($event)"
      />

    </app-interaction-panel>

  }


  <!-- =========================
       DIÁLOGOS
       ========================= -->

  @if (
    activeDialogue();
    as dialogue
  ) {

    <app-interaction-panel
      (closed)="closeDialogue()"
    >

      <app-dialogue
        [dialogue]="dialogue"
        (completed)="closeDialogue()"
      />

    </app-interaction-panel>

  }

</div>
