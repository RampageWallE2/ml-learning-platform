<div class="dialogue">

  <div class="conversation">

    <!-- JUGADOR -->
    @if (playerMessage(); as message) {
      <div
        class="message message--player"
        [class.message--active]="currentMessage()?.speaker === 'player'"
      >

        <div class="bubble">
          <strong>{{ message.name }}</strong>
          <p>{{ message.text }}</p>
        </div>

        @if (message.portrait) {
          <img
            class="portrait"
            [src]="message.portrait"
            [alt]="message.name"
          >
        } @else {
          <div class="portrait-placeholder">
            {{ message.name.charAt(0) }}
          </div>
        }

      </div>
    }


    <!-- NPC -->
    @if (npcMessage(); as message) {
      <div
        class="message message--npc"
        [class.message--active]="currentMessage()?.speaker === 'npc'"
      >

        @if (message.portrait) {
          <img
            class="portrait"
            [src]="message.portrait"
            [alt]="message.name"
          >
        } @else {
          <div class="portrait-placeholder">
            {{ message.name.charAt(0) }}
          </div>
        }

        <div class="bubble">
          <strong>{{ message.name }}</strong>
          <p>{{ message.text }}</p>
        </div>

      </div>
    }

  </div>


  <div class="dialogue-actions">
    <button 
      class="btn btn--primary"
      (click)="next()"
    >
      {{ isLastMessage() ? 'Continuar' : 'Siguiente' }}
    </button>
  </div>

</div>
