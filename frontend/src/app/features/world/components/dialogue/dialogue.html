<section class="dialogue" aria-label="Conversación">
  <div
    class="dialogue-band dialogue-band--npc"
    [class.dialogue-band--active]="currentMessage()?.speaker === 'npc'"
  >
    <div class="portrait-frame" [attr.data-character-id]="npcPortrait().characterId">
      <div
        class="character-portrait character-portrait--desktop"
        role="img"
        [attr.aria-label]="'Retrato de ' + (npcMessage()?.name ?? 'personaje')"
        [style.background-image]="'url(' + npcPortrait().src + ')'"
        [style.background-position]="npcPortrait().position"
        [style.background-size]="npcPortrait().size"
      ></div>
      <div
        class="character-portrait character-portrait--mobile"
        role="img"
        [attr.aria-label]="'Retrato de ' + (npcMessage()?.name ?? 'personaje')"
        [style.background-image]="'url(' + npcPortrait().src + ')'"
        [style.background-position]="npcPortrait().mobilePosition"
        [style.background-size]="npcPortrait().mobileSize"
      ></div>
    </div>

    @if (currentMessage()?.speaker === 'npc') {
      <div class="dialogue-copy" aria-live="polite" aria-atomic="true">
        <strong>{{ currentMessage()?.name }}</strong>
        <p
          class="dialogue-copy__text"
          [attr.aria-label]="currentMessage()?.text"
        >
          <span class="dialogue-copy__reserve" aria-hidden="true">
            {{ currentMessage()?.text }}
          </span>
          <span
            class="dialogue-copy__typed"
            [class.dialogue-copy__typed--active]="isTyping()"
            aria-hidden="true"
          >{{ displayedText() }}</span>
        </p>
      </div>
    }
  </div>

  <div class="dialogue-stage">
    <button type="button" class="continue-button" autofocus (click)="next()">
      <span>
        {{ isTyping() ? 'Mostrar texto' : (isLastMessage() ? 'Continuar' : 'Siguiente') }}
      </span>
      <small>
        {{ isTyping() ? 'clic para completar el mensaje' : 'clic para avanzar' }}
        · {{ progressLabel() }}
      </small>
    </button>
  </div>

  <div
    class="dialogue-band dialogue-band--player"
    [class.dialogue-band--active]="currentMessage()?.speaker === 'player'"
  >
    @if (currentMessage()?.speaker === 'player') {
      <div class="dialogue-copy" aria-live="polite" aria-atomic="true">
        <strong>{{ currentMessage()?.name }}</strong>
        <p
          class="dialogue-copy__text"
          [attr.aria-label]="currentMessage()?.text"
        >
          <span class="dialogue-copy__reserve" aria-hidden="true">
            {{ currentMessage()?.text }}
          </span>
          <span
            class="dialogue-copy__typed"
            [class.dialogue-copy__typed--active]="isTyping()"
            aria-hidden="true"
          >{{ displayedText() }}</span>
        </p>
      </div>
    }

    <div class="portrait-frame" [attr.data-character-id]="playerPortrait().characterId">
      <div
        class="character-portrait character-portrait--desktop"
        role="img"
        [attr.aria-label]="'Retrato de ' + (playerMessage()?.name ?? 'Tú')"
        [style.background-image]="'url(' + playerPortrait().src + ')'"
        [style.background-position]="playerPortrait().position"
        [style.background-size]="playerPortrait().size"
      ></div>
      <div
        class="character-portrait character-portrait--mobile"
        role="img"
        [attr.aria-label]="'Retrato de ' + (playerMessage()?.name ?? 'Tú')"
        [style.background-image]="'url(' + playerPortrait().src + ')'"
        [style.background-position]="playerPortrait().mobilePosition"
        [style.background-size]="playerPortrait().mobileSize"
      ></div>
    </div>
  </div>
</section>
