<div
  class="interaction-overlay"
  [class.interaction-overlay--dialogue]="mode() === 'dialogue'"
  [class.interaction-overlay--activity]="mode() === 'activity'"
>
  <div
    #panel
    class="interaction-panel"
    [class.interaction-panel--dialogue]="mode() === 'dialogue'"
    [class.interaction-panel--activity]="mode() === 'activity'"
    [class.interaction-panel--with-status]="!!statusTemplate()"
    role="dialog"
    tabindex="-1"
    aria-modal="true"
    (keydown)="onKeydown($event)"
    (focusin)="rememberFocus($event)"
    (keyup)="$event.key === ' ' && $event.stopPropagation()"
    [attr.aria-label]="mode() === 'dialogue' ? 'Conversación' : 'Actividad'"
  >
    <button
      type="button"
      class="close-button"
      [class.close-button--dialogue]="mode() === 'dialogue'"
      [attr.aria-label]="mode() === 'dialogue' ? 'Cerrar diálogo' : 'Cerrar actividad'"
      (click)="closed.emit()"
    >
      ×
    </button>

    <div
      class="interaction-content"
      [class.interaction-content--dialogue]="mode() === 'dialogue'"
      [class.interaction-content--activity]="mode() === 'activity'"
    >
      <div
        class="interaction-content-inner"
        [class.interaction-content-inner--dialogue]="mode() === 'dialogue'"
        [class.interaction-content-inner--activity]="mode() === 'activity'"
      >
        <ng-content />
      </div>
    </div>
    @if (statusTemplate(); as template) {
      <section #statusRegion class="interaction-status" tabindex="-1" aria-label="Estado del guardado">
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ inline: true }" />
      </section>
    }
  </div>
</div>
